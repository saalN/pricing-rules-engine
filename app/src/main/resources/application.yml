spring:
  application:
    name: priceforge
  datasource:
    url: jdbc:postgresql://localhost:5433/priceforge
    username: priceforge
    password: priceforge
  # Disable Spring Boot's single auto-configured Flyway instance: FlywayConfig runs one instance
  # per bounded-context schema instead (see arquitectura-tecnica.md, "Persistencia y Outbox").
  flyway:
    enabled: false

priceforge:
  security:
    jwt:
      # Local-dev-only fallback — override with the JWT_SECRET env var anywhere this matters.
      secret: ${JWT_SECRET:priceforge-local-dev-only-hmac-secret-change-me-32b+}
      expiration-minutes: 60

